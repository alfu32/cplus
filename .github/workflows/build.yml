name: Build and package

on:
  workflow_dispatch:

env:
  RELEASE_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || format('0.0.0-ci-{0}', github.run_number) }}

permissions:
  contents: read

jobs:
  parser-host-matrix:
    name: Test Tree-sitter parser (${{ matrix.host }})
    needs:
      - prepare-tinycc

    strategy:
      fail-fast: false
      matrix:
        include:
          - host: linux-x86_64
            runner: ubuntu-latest
          - host: linux-arm64
            runner: ubuntu-24.04-arm
          - host: macos-x86_64
            runner: macos-15-intel
          - host: macos-arm64
            runner: macos-14
          - host: windows-x86_64
            runner: windows-latest
          - host: windows-arm64
            runner: windows-11-arm

    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: tinycc-compiler-api
          path: lib

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build native parser and run corpus/JVM tests
        shell: bash
        env:
          PARSER_HOST: ${{ matrix.host }}
          CC: clang
          CXX: clang++
          TCC: clang
          CPLUS_TEST_COMPILER: clang
        run: |
          npm install --global tree-sitter-cli@0.25.10
          if [[ "$RUNNER_OS" == "Windows" ]]; then
          export PATH="$(cygpath -u "$(npm config get prefix)"):$PATH"
          fi
  
          ./gradlew \
            :parser-tree-sitter:jvmTest \
            :parser-tree-sitter:testTreeSitterGrammar \
            --no-daemon

      - name: Run host compiler and mapped-diagnostic regressions
        shell: bash
        env:
          PARSER_HOST: ${{ matrix.host }}
          CC: clang
          CXX: clang++
          TCC: clang
          CPLUS_TEST_COMPILER: clang
        run: |
          ./gradlew \
            :parser-tree-sitter:jvmTest \
            --tests 'cplus.parser.TreeSitterCPlusParserBackendTest.compilesPortableDialectAttributesAndStandardHeadersWithEveryHostDriver' \
            --tests 'cplus.parser.TreeSitterCPlusParserBackendTest.allAvailableHostCompilersPreserveMappedMethodDiagnosticLineAndColumn' \
            --no-daemon \
            --max-workers=1

          host_os="${PARSER_HOST%%-*}"
          host_arch="${PARSER_HOST#*-}"
          if [[ "$host_arch" == "x86_64" ]]; then
          host_arch=x64
          else
          host_arch=aarch64
          fi
  
          case "$host_os" in
          linux)   library=libktreesitter-c.so ;;
          macos)   library=libktreesitter-c.dylib ;;
          windows) library=ktreesitter-c.dll ;;
          esac
  
          library_path="$(find parser-tree-sitter/build -type f -name "$library" -print -quit)"
          test -n "$library_path"
  
          destination="parser-tree-sitter/build/parser-native-payload/lib/$host_os/$host_arch"
          mkdir -p "$destination"
          cp "$library_path" "$destination/$library"
          if [[ "$host_os" == "windows" ]]; then
          base_library_path="$(find parser-tree-sitter/build -type f -name 'ktreesitter.dll' -print -quit)"
          elif [[ "$host_os" == "macos" ]]; then
          base_library_path="$(find parser-tree-sitter/build -type f -name 'libktreesitter.dylib' -print -quit)"
          fi
          if [[ "$host_os" == "windows" || "$host_os" == "macos" ]]; then
          test -n "$base_library_path"
          cp "$base_library_path" "$destination/$(basename "$base_library_path")"
          fi
      - name: Record parser host and resource manifest
        shell: bash
        env:
          PARSER_HOST: ${{ matrix.host }}
        run: |
          report="parser-tree-sitter/build/parser-host-report"
          mkdir -p "$report"
          {
            echo "host=$PARSER_HOST"
            echo "runner_os=$RUNNER_OS"
            echo "runner_arch=$RUNNER_ARCH"
            echo "java=$(java -version 2>&1 | head -n 1)"
            echo "tree_sitter=$(tree-sitter --version 2>&1 | head -n 1)"
            echo "uname=$(uname -a 2>/dev/null || true)"
            for compiler in clang; do
              if command -v "$compiler" >/dev/null 2>&1; then
                echo "compiler.$compiler=$(command -v "$compiler")"
                "$compiler" --version 2>&1 | head -n 1 | sed "s/^/compiler.$compiler.version=/"
              fi
            done
          } > "$report/host.txt"
          find parser-tree-sitter/build/parser-native-payload -type f -print | sort |
            while IFS= read -r file; do
              if command -v sha256sum >/dev/null 2>&1; then
                digest=$(sha256sum "$file" | awk '{print $1}')
              else
                digest=$(shasum -a 256 "$file" | awk '{print $1}')
              fi
              size=$(wc -c < "$file" | tr -d ' ')
              printf '%s %s %s\n' "$digest" "$size" "$file"
            done > "$report/resources.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: tree-sitter-host-report-${{ matrix.host }}
          path: parser-tree-sitter/build/parser-host-report/
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: tree-sitter-native-${{ matrix.host }}
          path: parser-tree-sitter/build/parser-native-payload/
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  prepare-tinycc:
    name: Download latest TinyCC CLI payloads
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download bare and cross-without-sysroots TinyCC JARs
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash .github/scripts/download-tinycc.sh latest tinycc-cross-cli-no-sysroots.jar
      - uses: actions/upload-artifact@v4
        with:
          name: tinycc-compiler-api
          path: lib/tinycc-cli.jar
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
      - uses: actions/upload-artifact@v4
        with:
          name: tinycc-cli-payloads
          path: |
            lib/tinycc-cli.jar
            lib/tinycc-cross-cli-no-sysroots.jar
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  cli-artifacts:
    name: Build and test CLI JARs
    needs:
      - prepare-tinycc
      - parser-host-matrix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: tinycc-cli-payloads
          path: lib
      - uses: actions/download-artifact@v4
        with:
          pattern: tree-sitter-native-*
          path: parser-tree-sitter/build/parser-native-payload
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          pattern: tree-sitter-host-report-*
          path: build/parser-host-reports
          # Keep each host's host.txt/resources.txt in its artifact-named
          # directory; flattening them overwrites five of the six reports.
          merge-multiple: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned Tree-sitter CLI
        run: npm install --global tree-sitter-cli@0.25.10
      - uses: gradle/actions/setup-gradle@v4
      - name: Initialize CLI diagnostics
        shell: bash
        run: |
          mkdir -p build/ci-evidence
          {
            echo "workflow=${GITHUB_WORKFLOW}"
            echo "run=${GITHUB_RUN_ID}"
            echo "sha=${GITHUB_SHA}"
            echo "ref=${GITHUB_REF}"
            echo "runner_os=${RUNNER_OS}"
            echo "runner_arch=${RUNNER_ARCH}"
            echo "java_home=${JAVA_HOME:-}"
            echo "java=$(java -version 2>&1 | head -n 1)"
            echo "java_path=$(command -v java || true)"
            echo "clang_path=$(command -v clang || true)"
            echo "clang_version=$(clang --version 2>&1 | head -n 1 || true)"
            echo "cc_path=$(command -v cc || true)"
            echo "cc_version=$(cc --version 2>&1 | head -n 1 || true)"
            echo "tcc_path=$(command -v tcc || true)"
            echo "pwd=$(pwd)"
            echo "uname=$(uname -a 2>/dev/null || true)"
          } > build/ci-evidence/environment.txt
      - name: Run Gradle tests
        env:
          CC: clang
          CXX: clang++
          TCC: clang
          CPLUS_TEST_COMPILER: clang
        shell: bash
        run: |
          set -o pipefail
          ./gradlew test --no-daemon 2>&1 | tee build/ci-evidence/gradle-test.log

      - name: Build cross-runtime application ZIP (no sysroots)
        shell: bash
        run: |
          set -o pipefail
          ./gradlew "-Prelease=$RELEASE_VERSION" -Ptarget=cross bundleDist --no-daemon \
            2>&1 | tee build/ci-evidence/build-cross-runtime.log
      - name: Build system-compiler application ZIP
        shell: bash
        run: |
          set -o pipefail
          ./gradlew "-Prelease=$RELEASE_VERSION" -Ptarget=none bundleDist --no-daemon \
            2>&1 | tee build/ci-evidence/build-bare-runtime.log
      - name: Verify payload selection, documentation, installers, and both distributions
        shell: bash
        env:
          TCC: clang
          CC: clang
          CPLUS_TEST_COMPILER: clang
        run: |
          set -o pipefail
          exec > >(tee build/ci-evidence/distribution-verification.log) 2>&1
          set -x
          trap 'status=$?; set +x; { echo "failure_status=$status"; echo "failure_line=$LINENO"; echo "failure_command=$BASH_COMMAND"; find build/ci-evidence build/distribution-check dist -maxdepth 4 -type f -print 2>/dev/null | sort; } >> build/ci-evidence/failure-summary.txt; exit "$status"' ERR
          {
            echo "verification_release=$RELEASE_VERSION"
            echo "verification_tcc=$TCC"
            echo "verification_cc=$CC"
            echo "verification_test_compiler=$CPLUS_TEST_COMPILER"
            echo "tcc_path=$(command -v "$TCC" || true)"
            echo "cc_path=$(command -v "$CC" || true)"
            "$TCC" --version 2>&1 | head -n 3 || true
            "$CC" --version 2>&1 | head -n 3 || true
          } > build/ci-evidence/verification-environment.txt
          bare="dist/cplus-${RELEASE_VERSION}-bare.zip"
          cross="dist/cplus-${RELEASE_VERSION}-cross-no-sysroots.zip"
          test -s "$bare"
          test -s "$cross"

          mkdir -p build/distribution-check/bare build/distribution-check/cross
          unzip -q "$bare" -d build/distribution-check/bare
          unzip -q "$cross" -d build/distribution-check/cross
          for bundle in build/distribution-check/bare build/distribution-check/cross; do
            test -s "$bundle/c-plus.jar"
            test -s "$bundle/documentation/spec/SPEC.language.md"
            test -s "$bundle/documentation/spec/SPEC.compiler.md"
            test -s "$bundle/cpc.sh"
            test -s "$bundle/install.sh"
            test -s "$bundle/uninstall.sh"
            test -s "$bundle/install.zsh"
            test -s "$bundle/uninstall.zsh"
            test -s "$bundle/install.cmd"
            test -s "$bundle/uninstall.cmd"
            test -s "$bundle/install.ps1"
            test -s "$bundle/uninstall.ps1"
          done

          bare_jar="build/distribution-check/bare/c-plus.jar"
          cross_jar="build/distribution-check/cross/c-plus.jar"
          bare_targets="$(jar tf "$bare_jar" | sed -n 's|^native/\([^/]*\)/.*|\1|p' | sort -u)"
          test -z "$bare_targets"
          cross_targets="$(jar tf "$cross_jar" | sed -n 's|^native/\([^/]*\)/.*|\1|p' | sort -u)"
          expected_targets="$(printf '%s\n' linux-aarch64 linux-x86_64 macos-aarch64 macos-x86_64 windows-aarch64 windows-x86_64)"
          test "$cross_targets" = "$expected_targets"
          sysroots="$(jar tf "$cross_jar" | grep '/tinycc/sysroot/' || true)"
          test -z "$sysroots"

          for jar in "$bare_jar" "$cross_jar"; do
            parser_hosts="$(jar tf "$jar" | grep -E '^lib/(linux|macos|windows)/(x64|aarch64)/(libktreesitter-c\.so|libktreesitter-c\.dylib|ktreesitter-c\.dll)$' | sort -u | wc -l)"
            test "$parser_hosts" -eq 6
            parser_windows_base="$(jar tf "$jar" | grep -E '^lib/windows/(x64|aarch64)/ktreesitter\.dll$' | sort -u | wc -l)"
            test "$parser_windows_base" -eq 2
            parser_macos_base="$(jar tf "$jar" | grep -E '^lib/macos/(x64|aarch64)/libktreesitter\.dylib$' | sort -u | wc -l)"
            test "$parser_macos_base" -eq 2
          done
          test "$(find build/parser-host-reports -name host.txt | wc -l | tr -d ' ')" -eq 6
          test "$(find build/parser-host-reports -name resources.txt | wc -l | tr -d ' ')" -eq 6

          java -Dcplus.home="$PWD/build/distribution-check/bare" -jar "$bare_jar" help >/dev/null
          java -Dcplus.home="$PWD/build/distribution-check/cross" -jar "$cross_jar" help >/dev/null
          build/distribution-check/bare/cpc.sh compile build/distribution-check/bare/examples/basic.cp -o build/bare-smoke
          build/distribution-check/cross/cpc.sh compile build/distribution-check/cross/examples/basic.cp -o build/cross-smoke
          test -s build/bare-smoke
          test -s build/cross-smoke

          # The normal Gradle/CLI test suite exercises the live HTTP server. Keep
          # this artifact smoke test deterministic: some hosted/sandboxed runners
          # deny AF_INET sockets even on loopback. Compile the HTTP fixture below
          # so the shipped bundle still validates its networking surface without
          # making distribution verification depend on runner networking policy.
          mapfile -t fixtures < <(find stdlib/tests -maxdepth 1 -name '*.cp' ! -name 'raylib_math.cp' ! -name 'http.cp' -print | sort)
          test "${#fixtures[@]}" -gt 0
          set +e
          java -Dcplus.home="$PWD/build/distribution-check/bare" -jar "$bare_jar" -v2 test "${fixtures[@]}"
          fixture_test_status=$?
          set -e
          echo "Packaged non-HTTP fixture test exit code: $fixture_test_status"
          test "$fixture_test_status" -eq 0
          set +e
          java -Dcplus.home="$PWD/build/distribution-check/bare" -jar "$bare_jar" -v2 test compile \
            -o build/bare-http-smoke stdlib/tests/http.cp
          http_compile_status=$?
          set -e
          echo "HTTP fixture compile exit code: $http_compile_status"
          ls -l build/bare-http-smoke 2>/dev/null || true
          test "$http_compile_status" -eq 0
          test -s build/bare-http-smoke
      - uses: actions/upload-artifact@v4
        with:
          name: cplus-application-distributions
          path: |
            dist/cplus-${{ env.RELEASE_VERSION }}-bare.zip
            dist/cplus-${{ env.RELEASE_VERSION }}-cross-no-sysroots.zip
          if-no-files-found: error
          compression-level: 0
      - name: Upload CLI failure diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cplus-cli-diagnostics
          path: |
            build/ci-evidence/
            build/bare-smoke
            build/cross-smoke
            build/bare-http-smoke
          if-no-files-found: ignore
          retention-days: 14

  editor-plugins:
    name: Build editor plugin bundles
    needs:
      - prepare-tinycc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: tinycc-compiler-api
          path: lib
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: vscode-cplus/package-lock.json
      - name: Install pinned Tree-sitter CLI
        run: npm install --global tree-sitter-cli@0.25.10
      - name: Verify Tree-sitter CLI
        run: tree-sitter --version
      - name: Cache IntelliJ IDEA 2026.2.2 platform
        uses: actions/cache@v4
        with:
          path: intellij-cplus/.intellijPlatform/ides
          key: intellij-platform-${{ runner.os }}-idea-2026.2.2-${{ hashFiles('intellij-cplus/build.gradle.kts', 'intellij-cplus/settings.gradle.kts') }}
      - uses: gradle/actions/setup-gradle@v4
      - name: Install VS Code extension dependencies
        run: npm ci --prefix vscode-cplus
      - name: Test VS Code extension
        run: npm test --prefix vscode-cplus
      - name: Build versioned editor bundles
        run: ./gradlew "-Prelease=$RELEASE_VERSION" editorArtifacts --no-daemon
      - name: Collect deployable editor bundles
        run: |
          mkdir -p build/editor-release
          cp vscode-cplus/dist/*.vsix build/editor-release/
          cp intellij-cplus/build/distributions/*.zip build/editor-release/
          cp vim-cplus/dist/vim-cplus-*.zip vim-cplus/dist/vim-cplus-*.tar.gz build/editor-release/
          test -n "$(find build/editor-release -maxdepth 1 -type f -print -quit)"
      - uses: actions/upload-artifact@v4
        with:
          name: cplus-editor-plugins
          path: build/editor-release/*
          if-no-files-found: error
          compression-level: 0

  publish-release:
    name: Publish GitHub release
    if: github.ref_type == 'tag'
    needs:
      - cli-artifacts
      - editor-plugins
      - parser-host-matrix
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          name: cplus-application-distributions
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          name: cplus-editor-plugins
      - name: Create or update release and upload application distributions and IDE plugins
        env:
          GH_TOKEN: ${{ github.token }}
        RELEASE_TAG: ${{ github.ref_name }}
        run: |
          shopt -s nullglob
          mapfile -t assets < <(find release-assets -maxdepth 1 -type f -print | sort)
          if (( ${#assets[@]} == 0 )); then
            echo "No release assets were downloaded" >&2
            exit 1
          fi
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
          else
            gh release create "$RELEASE_TAG" "${assets[@]}" --verify-tag --generate-notes
          fi
