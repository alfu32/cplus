name: Build and package

on:
  workflow_dispatch:

env:
  RELEASE_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || format('0.0.0-ci-{0}', github.run_number) }}

permissions:
  contents: read

jobs:
  prepare-tinycc:
    name: Download latest TinyCC CLI payloads
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download bare and cross-without-sysroots TinyCC JARs
        run: bash .github/scripts/download-tinycc.sh latest tinycc-cross-cli-no-sysroots.jar
      - uses: actions/upload-artifact@v4
        with:
          name: tinycc-cli-payloads
          path: |
            lib/tinycc-cli.jar
            lib/tinycc-cross-cli-no-sysroots.jar
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  cli-artifacts:
    name: Build and test CLI JARs
    needs: prepare-tinycc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: tinycc-cli-payloads
          path: lib
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install system TinyCC for the bare JAR
        run: |
          sudo apt-get update
          sudo apt-get install --yes tcc
      - name: Run Gradle tests
        run: ./gradlew test --no-daemon
      - name: Build bare JAR using external TinyCC
        run: ./gradlew "-Prelease=$RELEASE_VERSION" -Ptarget=none bundleJar --no-daemon
      - name: Build cross-host JAR without bundled sysroots
        run: ./gradlew "-Prelease=$RELEASE_VERSION" -Ptarget=cross bundleJar --no-daemon
      - name: Verify payload selection and smoke-test both JARs
        shell: bash
        run: |
          bare="dist/cplus-${RELEASE_VERSION}-bare.jar"
          cross="dist/cplus-${RELEASE_VERSION}-cross-no-sysroots.jar"
          test -s "$bare"
          test -s "$cross"

          bare_targets="$(jar tf "$bare" | sed -n 's|^native/\([^/]*\)/.*|\1|p' | sort -u)"
          test -z "$bare_targets"
          cross_targets="$(jar tf "$cross" | sed -n 's|^native/\([^/]*\)/.*|\1|p' | sort -u)"
          expected_targets="$(printf '%s\n' linux-aarch64 linux-x86_64 macos-aarch64 macos-x86_64 windows-aarch64 windows-x86_64)"
          test "$cross_targets" = "$expected_targets"
          sysroots="$(jar tf "$cross" | grep '/tinycc/sysroot/' || true)"
          test -z "$sysroots"

          java -jar "$bare" help >/dev/null
          java -jar "$cross" help >/dev/null
          java -jar "$cross" --stdlib stdlib compile examples/basic.cp -o build/cross-host-smoke
          test -s build/cross-host-smoke

          mapfile -t fixtures < <(find stdlib/tests -maxdepth 1 -name '*.cp' ! -name 'raylib_math.cp' -print | sort)
          test "${#fixtures[@]}" -gt 0
          java -jar "$bare" --stdlib stdlib test "${fixtures[@]}"
      - uses: actions/upload-artifact@v4
        with:
          name: cplus-cli-jars
          path: |
            dist/cplus-${{ env.RELEASE_VERSION }}-bare.jar
            dist/cplus-${{ env.RELEASE_VERSION }}-cross-no-sysroots.jar
          if-no-files-found: error
          compression-level: 0

  editor-plugins:
    name: Build editor plugin bundles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: vscode-cplus/package-lock.json
      - name: Cache IntelliJ IDEA 2026.2.2 platform
        uses: actions/cache@v4
        with:
          path: intellij-cplus/.intellijPlatform/ides
          key: intellij-platform-${{ runner.os }}-idea-2026.2.2-${{ hashFiles('intellij-cplus/build.gradle.kts', 'intellij-cplus/settings.gradle.kts') }}
      - uses: gradle/actions/setup-gradle@v4
      - name: Install VS Code extension dependencies
        run: npm ci --prefix vscode-cplus
      - name: Test VS Code extension
        run: npm test --prefix vscode-cplus
      - name: Build versioned editor bundles
        run: ./gradlew "-Prelease=$RELEASE_VERSION" editorArtifacts --no-daemon
      - name: Collect deployable editor bundles
        run: |
          mkdir -p build/editor-release
          cp vscode-cplus/dist/*.vsix build/editor-release/
          cp intellij-cplus/build/distributions/*.zip build/editor-release/
          cp vim-cplus/dist/vim-cplus-*.zip vim-cplus/dist/vim-cplus-*.tar.gz build/editor-release/
          test -n "$(find build/editor-release -maxdepth 1 -type f -print -quit)"
      - uses: actions/upload-artifact@v4
        with:
          name: cplus-editor-plugins
          path: build/editor-release/*
          if-no-files-found: error
          compression-level: 0

  publish-release:
    name: Publish GitHub release
    if: github.ref_type == 'tag'
    needs:
      - cli-artifacts
      - editor-plugins
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: cplus-*
          merge-multiple: true
      - name: Create or update release and upload CLI JARs and IDE plugins
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          shopt -s nullglob
          assets=(release-assets/*)
          if (( ${#assets[@]} == 0 )); then
            echo "No release assets were downloaded" >&2
            exit 1
          fi
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
          else
            gh release create "$RELEASE_TAG" "${assets[@]}" --verify-tag --generate-notes
          fi
