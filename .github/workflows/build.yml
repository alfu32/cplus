name: Build and package

on:
  workflow_dispatch:

env:
  RELEASE_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || format('0.0.0-ci-{0}', github.run_number) }}

permissions:
  contents: read

jobs:
  test-and-smoke:
    name: Tests and Linux bundle smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Run Gradle tests
        run: ./gradlew test --no-daemon
      - name: Build and smoke-test Linux x86_64 bundle
        run: |
          release="$RELEASE_VERSION"
          ./gradlew "-Prelease=$release" -Pos=linux -Parch=x86_64 bundleDist --no-daemon
          archive="dist/cplus-${release}-linux-x86_64.zip"
          mkdir -p build/bundle-smoke
          unzip -q "$archive" -d build/bundle-smoke
          cd build/bundle-smoke
          ./cpc.sh version
          ./cpc.sh test stdlib/tests/*.cp
          temp_dir="$(mktemp -d)"
          trap 'rm -rf "$temp_dir"' EXIT
          ./cpc.sh new "$temp_dir/example"
          ./cpc.sh run "$temp_dir/example/src/main.cp"

  distribution-matrix:
    name: Bundle ${{ matrix.os }} / ${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            arch: x86_64
          - os: linux
            arch: arm64
          - os: mac
            arch: x86_64
          - os: mac
            arch: arm64
          - os: win
            arch: x86_64
          - os: win
            arch: arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build platform bundle
        run: ./gradlew "-Prelease=$RELEASE_VERSION" "-Pos=${{ matrix.os }}" "-Parch=${{ matrix.arch }}" bundleDist --no-daemon
      - name: Verify selected native target
        shell: bash
        run: |
          native_os='${{ matrix.os }}'
          case "$native_os" in
            mac) native_os=macos ;;
            win) native_os=windows ;;
          esac
          native_arch='${{ matrix.arch }}'
          if [[ "$native_arch" == arm64 ]]; then native_arch=aarch64; fi
          targets="$(jar tf cli/build/libs/c-plus.jar | sed -n 's|^native/\([^/]*\)/.*|\1|p' | sort -u)"
          test "$targets" = "$native_os-$native_arch"
      - uses: actions/upload-artifact@v4
        with:
          name: cplus-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/cplus-${{ env.RELEASE_VERSION }}-${{ matrix.os }}-${{ matrix.arch }}.zip
          if-no-files-found: error
          compression-level: 0

  all-target-bundle:
    name: Complete all-OS / all-architecture bundle
    runs-on: ubuntu-latest
    needs: test-and-smoke
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build complete bundle
        run: ./gradlew "-Prelease=$RELEASE_VERSION" -Pos=all -Parch=all bundleDist --no-daemon
      - name: Verify all six native targets and all launchers
        run: |
          native_targets="$(jar tf cli/build/libs/c-plus.jar | sed -n 's|^native/\([^/]*\)/.*|\1|p' | sort -u)"
          for target in linux-x86_64 linux-aarch64 macos-x86_64 macos-aarch64 windows-x86_64 windows-aarch64; do
            grep -Fx "$target" "build/distributions/cplus-${RELEASE_VERSION}-all-all/TARGETS.txt"
            grep -Fx "$target" <<< "$native_targets"
          done
          for entry in cpc.sh cpc.zsh cpc.cmd install.sh install.zsh install.cmd uninstall.sh uninstall.zsh uninstall.cmd; do
            test -f "build/distributions/cplus-${RELEASE_VERSION}-all-all/$entry"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: cplus-all-all
          path: dist/cplus-${{ env.RELEASE_VERSION }}-all-all.zip
          if-no-files-found: error
          compression-level: 0

  editor-plugins:
    name: Build editor plugin bundles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: vscode-cplus/package-lock.json
      - name: Cache IntelliJ IDEA 2026.2.2 platform
        uses: actions/cache@v4
        with:
          path: intellij-cplus/.intellijPlatform/ides
          key: intellij-platform-${{ runner.os }}-idea-2026.2.2-${{ hashFiles('intellij-cplus/build.gradle.kts', 'intellij-cplus/settings.gradle.kts') }}
      - uses: gradle/actions/setup-gradle@v4
      - name: Install VS Code extension dependencies
        run: npm ci --prefix vscode-cplus
      - name: Test VS Code extension
        run: npm test --prefix vscode-cplus
      - name: Build versioned editor bundles
        run: ./gradlew "-Prelease=$RELEASE_VERSION" editorArtifacts --no-daemon
      - name: Collect deployable editor bundles
        run: |
          mkdir -p build/editor-release
          cp vscode-cplus/dist/*.vsix build/editor-release/
          cp intellij-cplus/build/distributions/*.zip build/editor-release/
          cp vim-cplus/dist/vim-cplus-*.zip vim-cplus/dist/vim-cplus-*.tar.gz build/editor-release/
          test -n "$(find build/editor-release -maxdepth 1 -type f -print -quit)"
      - uses: actions/upload-artifact@v4
        with:
          name: cplus-editor-plugins
          path: build/editor-release/*
          if-no-files-found: error
          compression-level: 0

  installer-syntax:
    name: Check platform installer syntax
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            platform: macos
          - runner: windows-latest
            platform: windows
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Check zsh and shell scripts
        if: matrix.platform == 'macos'
        run: |
          for script in distribution/macos/install.zsh distribution/macos/uninstall.zsh distribution/launchers/cpc.zsh; do zsh -n "$script"; done
          for script in distribution/linux/install.sh distribution/linux/uninstall.sh distribution/launchers/cpc.sh; do bash -n "$script"; done
      - name: Parse PowerShell installers
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $parseErrors = $null
          Get-ChildItem distribution/windows/*.ps1 | ForEach-Object {
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$parseErrors) | Out-Null
          }
          if ($parseErrors) { $parseErrors | ForEach-Object { Write-Error $_ }; exit 1 }
          if (-not (Test-Path distribution/windows/install.cmd) -or -not (Test-Path distribution/windows/uninstall.cmd)) { exit 1 }

  publish-release:
    name: Publish GitHub release
    if: github.ref_type == 'tag'
    needs:
      - test-and-smoke
      - distribution-matrix
      - all-target-bundle
      - editor-plugins
      - installer-syntax
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Create or update release and upload bundles
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          shopt -s nullglob
          assets=(release-assets/*)
          if (( ${#assets[@]} == 0 )); then
            echo "No release assets were downloaded" >&2
            exit 1
          fi
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
          else
            gh release create "$RELEASE_TAG" "${assets[@]}" --verify-tag --generate-notes
          fi
