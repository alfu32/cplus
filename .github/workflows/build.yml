name: Build and package

on:
  workflow_dispatch:

env:
  RELEASE_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || format('0.0.0-ci-{0}', github.run_number) }}

permissions:
  contents: read

jobs:
  parser-host-matrix:
    name: Test Tree-sitter parser (${{ matrix.host }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - host: linux-x86_64
            runner: ubuntu-latest
          - host: linux-arm64
            runner: ubuntu-24.04-arm
          - host: macos-x86_64
            runner: macos-15-intel
          - host: macos-arm64
            runner: macos-14
          - host: windows-x86_64
            runner: windows-latest
          - host: windows-arm64
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build native parser and run corpus/JVM tests
        shell: bash
        env:
          PARSER_HOST: ${{ matrix.host }}
        run: |
          npm install --global tree-sitter-cli@0.25.10
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            export PATH="$(cygpath -u "$(npm config get prefix)"):$PATH"
          fi
          ./gradlew :parser-tree-sitter:jvmTest :parser-tree-sitter:testTreeSitterGrammar --no-daemon
          host_os="${PARSER_HOST%%-*}"
          host_arch="${PARSER_HOST#*-}"
          if [[ "$host_arch" == "x86_64" ]]; then host_arch=x64; else host_arch=aarch64; fi
          case "$host_os" in linux) library=libktreesitter-c.so ;; macos) library=libktreesitter-c.dylib ;; windows) library=ktreesitter-c.dll ;; esac
          library_path="$(find parser-tree-sitter/build -type f -name "$library" -print -quit)"
          test -n "$library_path"
          destination="parser-tree-sitter/build/parser-native-payload/lib/$host_os/$host_arch"
          mkdir -p "$destination"
          cp "$library_path" "$destination/$library"
      - uses: actions/upload-artifact@v4
        with:
          name: tree-sitter-native-${{ matrix.host }}
          path: parser-tree-sitter/build/parser-native-payload/
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  prepare-tinycc:
    name: Download latest TinyCC CLI payloads
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download bare and cross-without-sysroots TinyCC JARs
        run: bash .github/scripts/download-tinycc.sh latest tinycc-cross-cli-no-sysroots.jar
      - uses: actions/upload-artifact@v4
        with:
          name: tinycc-cli-payloads
          path: |
            lib/tinycc-cli.jar
            lib/tinycc-cross-cli-no-sysroots.jar
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  cli-artifacts:
    name: Build and test CLI JARs
    needs:
      - prepare-tinycc
      - parser-host-matrix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: tinycc-cli-payloads
          path: lib
      - uses: actions/download-artifact@v4
        with:
          pattern: tree-sitter-native-*
          path: parser-tree-sitter/build/parser-native-payload
          merge-multiple: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned Tree-sitter CLI
        run: npm install --global tree-sitter-cli@0.25.10
      - uses: gradle/actions/setup-gradle@v4
      - name: Install system TinyCC for the bare JAR
        run: |
          sudo apt-get update
          sudo apt-get install --yes tcc
      - name: Run Gradle tests
        run: ./gradlew test --no-daemon
      - name: Build cross-runtime application ZIP (no sysroots)
        run: ./gradlew "-Prelease=$RELEASE_VERSION" -Ptarget=cross bundleDist --no-daemon
      - name: Build system-compiler application ZIP
        run: ./gradlew "-Prelease=$RELEASE_VERSION" -Ptarget=none bundleDist --no-daemon
      - name: Verify payload selection, documentation, installers, and both distributions
        shell: bash
        run: |
          bare="dist/cplus-${RELEASE_VERSION}-bare.zip"
          cross="dist/cplus-${RELEASE_VERSION}-cross-no-sysroots.zip"
          test -s "$bare"
          test -s "$cross"

          mkdir -p build/distribution-check/bare build/distribution-check/cross
          unzip -q "$bare" -d build/distribution-check/bare
          unzip -q "$cross" -d build/distribution-check/cross
          for bundle in build/distribution-check/bare build/distribution-check/cross; do
            test -s "$bundle/c-plus.jar"
            test -s "$bundle/documentation/spec/SPEC.language.md"
            test -s "$bundle/documentation/spec/SPEC.compiler.md"
            test -s "$bundle/cpc.sh"
            test -s "$bundle/install.sh"
            test -s "$bundle/uninstall.sh"
            test -s "$bundle/install.zsh"
            test -s "$bundle/uninstall.zsh"
            test -s "$bundle/install.cmd"
            test -s "$bundle/uninstall.cmd"
            test -s "$bundle/install.ps1"
            test -s "$bundle/uninstall.ps1"
          done

          bare_jar="build/distribution-check/bare/c-plus.jar"
          cross_jar="build/distribution-check/cross/c-plus.jar"
          bare_targets="$(jar tf "$bare_jar" | sed -n 's|^native/\([^/]*\)/.*|\1|p' | sort -u)"
          test -z "$bare_targets"
          cross_targets="$(jar tf "$cross_jar" | sed -n 's|^native/\([^/]*\)/.*|\1|p' | sort -u)"
          expected_targets="$(printf '%s\n' linux-aarch64 linux-x86_64 macos-aarch64 macos-x86_64 windows-aarch64 windows-x86_64)"
          test "$cross_targets" = "$expected_targets"
          sysroots="$(jar tf "$cross_jar" | grep '/tinycc/sysroot/' || true)"
          test -z "$sysroots"

          for jar in "$bare_jar" "$cross_jar"; do
            parser_hosts="$(jar tf "$jar" | grep -E '^lib/(linux|macos|windows)/(x64|aarch64)/(libktreesitter-c\.so|libktreesitter-c\.dylib|ktreesitter-c\.dll)$' | sort -u | wc -l)"
            test "$parser_hosts" -eq 6
          done

          java -Dcplus.home="$PWD/build/distribution-check/bare" -jar "$bare_jar" help >/dev/null
          java -Dcplus.home="$PWD/build/distribution-check/cross" -jar "$cross_jar" help >/dev/null
          build/distribution-check/bare/cpc.sh compile build/distribution-check/bare/examples/basic.cp -o build/bare-smoke
          build/distribution-check/cross/cpc.sh compile build/distribution-check/cross/examples/basic.cp -o build/cross-smoke
          test -s build/bare-smoke
          test -s build/cross-smoke

          mapfile -t fixtures < <(find stdlib/tests -maxdepth 1 -name '*.cp' ! -name 'raylib_math.cp' -print | sort)
          test "${#fixtures[@]}" -gt 0
          java -Dcplus.home="$PWD/build/distribution-check/bare" -jar "$bare_jar" test "${fixtures[@]}"
      - uses: actions/upload-artifact@v4
        with:
          name: cplus-application-distributions
          path: |
            dist/cplus-${{ env.RELEASE_VERSION }}-bare.zip
            dist/cplus-${{ env.RELEASE_VERSION }}-cross-no-sysroots.zip
          if-no-files-found: error
          compression-level: 0

  editor-plugins:
    name: Build editor plugin bundles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: vscode-cplus/package-lock.json
      - name: Cache IntelliJ IDEA 2026.2.2 platform
        uses: actions/cache@v4
        with:
          path: intellij-cplus/.intellijPlatform/ides
          key: intellij-platform-${{ runner.os }}-idea-2026.2.2-${{ hashFiles('intellij-cplus/build.gradle.kts', 'intellij-cplus/settings.gradle.kts') }}
      - uses: gradle/actions/setup-gradle@v4
      - name: Install VS Code extension dependencies
        run: npm ci --prefix vscode-cplus
      - name: Test VS Code extension
        run: npm test --prefix vscode-cplus
      - name: Build versioned editor bundles
        run: ./gradlew "-Prelease=$RELEASE_VERSION" editorArtifacts --no-daemon
      - name: Collect deployable editor bundles
        run: |
          mkdir -p build/editor-release
          cp vscode-cplus/dist/*.vsix build/editor-release/
          cp intellij-cplus/build/distributions/*.zip build/editor-release/
          cp vim-cplus/dist/vim-cplus-*.zip vim-cplus/dist/vim-cplus-*.tar.gz build/editor-release/
          test -n "$(find build/editor-release -maxdepth 1 -type f -print -quit)"
      - uses: actions/upload-artifact@v4
        with:
          name: cplus-editor-plugins
          path: build/editor-release/*
          if-no-files-found: error
          compression-level: 0

  publish-release:
    name: Publish GitHub release
    if: github.ref_type == 'tag'
    needs:
      - cli-artifacts
      - editor-plugins
      - parser-host-matrix
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: cplus-*
          merge-multiple: true
      - name: Create or update release and upload application distributions and IDE plugins
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          shopt -s nullglob
          assets=(release-assets/*)
          if (( ${#assets[@]} == 0 )); then
            echo "No release assets were downloaded" >&2
            exit 1
          fi
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
          else
            gh release create "$RELEASE_TAG" "${assets[@]}" --verify-tag --generate-notes
          fi
