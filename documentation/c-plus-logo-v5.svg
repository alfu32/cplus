<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">
  <title id="title">C+ programming language logo</title>
  <desc id="desc">A light gray-blue C paired with a blue-indigo crossed bandage plus.</desc>

  <defs>
    <linearGradient id="bandageGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6b7cff"/>
      <stop offset="100%" stop-color="#4457d6"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.6" stdDeviation="1.8" flood-color="#000000" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Letter C supplied by user -->
  <path fill="#a9bacd" d="M125 50c-4-32-24-50-62-50C29 0 3 24 3 64c0 39 24 64 64 64 32 0 55-19 58-50H87c-2 11-8 20-20 20-21 0-24-16-24-33 0-23 8-35 22-35 13 0 20 7 22 20z" />

  <!-- Bandage plus -->
  <g transform="translate(92 44) rotate(3) scale(1.5)">
    <!-- horizontal strip -->
    <rect x="-23" y="-8" width="46" height="16" rx="8" fill="#6b7cff"/>
    <!-- vertical strip -->
    <rect x="-8" y="-23" width="16" height="46" rx="8" fill="#4457d6"/>

    <!-- central pad -->
    <rect x="-8.5" y="-8.5" width="17" height="17" rx="4.4" fill="#2f3ea7" opacity="0.45"/>

    <!-- perforations -->
    <g fill="#d7defe" opacity="0.95">
      <!-- horizontal left -->
      <circle cx="-17" cy="-3.2" r="1.05"/><circle cx="-11.5" cy="-3.2" r="1.05"/>
      <circle cx="-17" cy="2.2" r="1.05"/><circle cx="-11.5" cy="2.2" r="1.05"/>
      <!-- horizontal right -->
      <circle cx="11.5" cy="-3.2" r="1.05"/><circle cx="17" cy="-3.2" r="1.05"/>
      <circle cx="11.5" cy="2.2" r="1.05"/><circle cx="17" cy="2.2" r="1.05"/>
      <!-- vertical top -->
      <circle cx="-3.2" cy="-17" r="1.05"/><circle cx="2.2" cy="-17" r="1.05"/>
      <circle cx="-3.2" cy="-11.5" r="1.05"/><circle cx="2.2" cy="-11.5" r="1.05"/>
      <!-- vertical bottom -->
      <circle cx="-3.2" cy="11.5" r="1.05"/><circle cx="2.2" cy="11.5" r="1.05"/>
      <circle cx="-3.2" cy="17" r="1.05"/><circle cx="2.2" cy="17" r="1.05"/>
    </g>
  </g>
</svg>
