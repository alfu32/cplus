# CI and constrained build hosts can terminate the Kotlin daemon while native
# parser tests and Kotlin compilation are active. Compile in the Gradle
# process so the build has one lifecycle and reports failures directly.
kotlin.compiler.execution.strategy=in-process

# Give the Gradle process enough room for the Kotlin compiler and parser tests.
org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
